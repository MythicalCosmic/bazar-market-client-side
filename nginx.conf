server {
    listen 80;
    server_name bazarmarket.org www.bazarmarket.org;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──
    # frame-ancestors intentionally allows Telegram (the Mini App renders inside
    # web.telegram.org's iframe) while blocking every other embedder — so we do
    # NOT send X-Frame-Options, which can't express that allowlist.
    # script/style/img/connect stay permissive enough for the Telegram SDK,
    # Yandex Maps and Google Fonts; object-src/base-uri close common injection holes.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org https://*.telegram.org https://*.yandex.ru https://*.yandex.net https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.bazarmarket.org https://files.bazarmarket.org https://*.yandex.ru https://*.yandex.net https://geocode-maps.yandex.ru; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
